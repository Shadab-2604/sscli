[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "systemscan"
version = "1.0.0"
description = "Universal System Security & Intelligence CLI - Cross-platform audit, diagnostics, and security scanner"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Shadab-2604" }
]
keywords = [
    "security",
    "cli",
    "intelligence",
    "system-audit",
    "diagnostics",
    "cross-platform",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "platformdirs>=4.2.0",
    "psutil>=5.9.0",
    "py-cpuinfo>=9.0.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "types-psutil>=5.9.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
systemscan = "systemscan.cli:main"

[project.urls]
Homepage = "https://github.com/Shadab-2604/sscli"
Repository = "https://github.com/Shadab-2604/sscli.git"
Issues = "https://github.com/Shadab-2604/sscli/issues"
Changelog = "https://github.com/Shadab-2604/sscli/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/systemscan"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "F401", "F841", "I001"]

[tool.mypy]
python_version = "3.10"
packages = ["systemscan"]
mypy_path = "src"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["cpuinfo.*"]
ignore_missing_imports = true
