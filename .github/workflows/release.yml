name: Release Packaging & Verification

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Semantic version to build and verify (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      dry_run:
        description: 'Run build and verification without publishing GitHub release'
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  id-token: write

jobs:
  validate-and-build:
    name: Build & Verify Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build and validation tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine ruff mypy pytest pytest-cov
          pip install -e ".[dev]"

      - name: Run Quality Gate - Lint & Typecheck
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy src

      - name: Run Quality Gate - Automated Test Suite
        run: |
          pytest --cov=systemscan --cov-report=term-missing tests/

      - name: Build Source Distribution & Binary Wheel
        run: |
          python -m build

      - name: Validate Package Metadata with Twine
        run: |
          python -m twine check --strict dist/*

      - name: Generate Cryptographic SHA-256 Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release (Non-Dry Run Only)
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

